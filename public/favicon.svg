<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#FACC15"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#FACC15" stroke="#000" stroke-width="2.5"/>
  <!-- Crossed swords -->
  <g transform="translate(16,16) rotate(45)" stroke="#000" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-4" y1="-3" x2="4" y2="-3"/>
    <polygon points="0,-9 -2,-7 2,-7" fill="#000" stroke="none"/>
  </g>
  <g transform="translate(16,16) rotate(-45)" stroke="#000" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-4" y1="-3" x2="4" y2="-3"/>
    <polygon points="0,-9 -2,-7 2,-7" fill="#000" stroke="none"/>
  </g>
</svg>
